<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Labo Déo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0C1510;--surface:#131E18;--card:#192120;--border:#243028;
      --accent:#C97245;--gold:#C8A85C;--text:#EBE5D8;--muted:#6E8078;--dim:#3A4A40;
      --green:#5AAA6E;--red:#C05858;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}
    body{padding-bottom:110px}
    input,textarea,select{font-size:16px;color:var(--text);background:transparent;font-family:'DM Sans',sans-serif}
    input::placeholder,textarea::placeholder{color:var(--dim)}
    input:focus,textarea:focus,select:focus{outline:none}
    button{font-family:'DM Sans',sans-serif;cursor:pointer;transition:opacity .15s,transform .1s;border:none}
    button:active{transform:scale(.93)}
    select option{background:var(--surface);color:var(--text)}
    input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
    ::-webkit-scrollbar{width:3px}
    ::-webkit-scrollbar-thumb{background:var(--dim);border-radius:2px}
    @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes sh{from{transform:translateY(100%)}to{transform:translateY(0)}}
    @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
    .up{animation:up .22s ease forwards}

    .hdr{padding:52px 20px 14px;background:linear-gradient(to bottom,var(--surface),var(--bg))}
    .hdr-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .hdr-title{font-family:'Playfair Display',serif;font-size:28px;letter-spacing:-.5px}
    .hdr-sub{font-size:10px;color:var(--muted);letter-spacing:2.5px;text-transform:uppercase;margin-top:4px;margin-bottom:14px}
    .hdr-actions{display:flex;gap:6px;flex-shrink:0;padding-top:4px}
    .hact{width:38px;height:38px;border-radius:10px;background:var(--surface);border:1px solid var(--border);color:var(--gold);font-size:15px;display:flex;align-items:center;justify-content:center}
    .sync-pill{display:inline-flex;align-items:center;gap:5px;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
    .sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
    .sync-dot.warn{background:var(--gold)}
    .sync-dot.err{background:var(--red)}
    .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .tbtn{padding:6px 14px;border-radius:20px;font-size:11px;border:1px solid var(--border);background:transparent;color:var(--muted)}
    .tbtn.on{background:var(--surface);color:var(--gold);border-color:var(--gold)}
    .tbtn.cmp.on{background:rgba(201,114,69,.12);color:var(--accent);border-color:var(--accent)}

    .groups{padding:10px 14px 0}
    .group{margin-bottom:12px;border-radius:16px;overflow:hidden;border:1px solid var(--border)}
    .group-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--surface);cursor:pointer;user-select:none}
    .group-left{display:flex;align-items:center;gap:10px}
    .group-name{font-family:'Playfair Display',serif;font-size:17px;font-weight:700}
    .group-meta{font-size:11px;color:var(--muted);margin-top:1px}
    .group-right{display:flex;align-items:center;gap:8px}
    .gs{font-size:11px;color:var(--gold);opacity:.2}
    .gs.on{opacity:1}
    .group-chev{color:var(--dim);font-size:13px;transition:transform .22s}
    .group-chev.open{transform:rotate(180deg)}
    .group-body{background:var(--bg);display:none}
    .group-body.open{display:block}

    .proto-card{border-top:1px solid var(--border);background:var(--card)}
    .proto-hdr{padding:12px 16px 12px 28px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
    .proto-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;background:var(--gold);opacity:.6}
    .proto-name{font-family:'Playfair Display',serif;font-size:14px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .proto-meta{font-size:10px;color:var(--muted)}
    .ps{font-size:11px;color:var(--gold);opacity:.2}
    .ps.on{opacity:1}
    .proto-body{border-top:1px solid var(--border);background:var(--bg)}
    .csec{padding:14px 16px 14px 28px}
    .slabel{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
    .frow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-family:'IBM Plex Mono',monospace}
    .frow:last-child{border-bottom:none}
    .ftotal{display:flex;justify-content:space-between;padding-top:6px;font-size:11px;color:var(--dim)}
    .obs{font-size:13px;color:#AABCB4;line-height:1.75;font-style:italic;white-space:pre-wrap}
    .divider{height:1px;background:var(--border);margin:0 16px}
    .proto-actions{display:flex;border-top:1px solid var(--border)}
    .pact{flex:1;padding:12px 8px;background:none;font-size:12px}

    .cmp-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--dim);background:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;transition:all .15s}
    .cmp-check.sel{background:var(--accent);border-color:var(--accent);color:#fff}

    .cmp-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:14px 18px 20px;display:flex;align-items:center;gap:10px;z-index:50}
    .cmp-bar-txt{flex:1;font-size:13px;color:var(--muted)}
    .cmp-go{padding:11px 20px;background:linear-gradient(140deg,var(--accent),#9A5430);border:none;border-radius:10px;color:#fff;font-size:13px;font-weight:500}
    .cmp-go:disabled{opacity:.4}
    .cmp-reset{padding:11px 14px;background:none;border:1px solid var(--border);border-radius:10px;color:var(--muted);font-size:12px}

    .cmp-view{padding-bottom:40px}
    .cmp-hdr{padding:52px 18px 18px;background:linear-gradient(to bottom,var(--surface),var(--bg));display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border)}
    .cmp-title{font-family:'Playfair Display',serif;font-size:20px}
    .cmp-subtitle{font-size:11px;color:var(--muted);margin-top:2px}
    .cmp-legend{margin:12px 14px 0;display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
    .leg{display:flex;align-items:center;gap:4px}
    .cmp-table{margin:12px 14px 0;border-radius:14px;overflow:hidden;border:1px solid var(--border);overflow-x:auto}
    .cmp-inner{min-width:100%}
    .cmp-thead{display:flex;background:var(--surface);border-bottom:2px solid var(--border)}
    .cmp-th-ing{flex:0 0 110px;padding:10px 12px;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
    .cmp-th-v{flex:1;min-width:90px;padding:10px 8px;font-size:11px;font-weight:600;color:var(--gold);text-align:center;border-left:1px solid var(--border)}
    .cmp-row{display:flex;border-bottom:1px solid var(--border);background:var(--card)}
    .cmp-row:last-child{border-bottom:none}
    .cmp-row.has-diff{background:rgba(201,114,69,.05)}
    .cmp-row.total-row{background:var(--surface)}
    .cmp-ing{flex:0 0 110px;padding:9px 12px;font-size:12px;color:var(--text);display:flex;align-items:center}
    .cmp-cell{flex:1;min-width:90px;padding:9px 8px;border-left:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:'IBM Plex Mono',monospace;font-size:12px}
    .cmp-cell.absent{color:var(--dim)}
    .cmp-cell.same{color:var(--gold)}
    .cmp-cell.hi{color:var(--green);font-weight:700}
    .cmp-cell.lo{color:var(--red);font-weight:700}
    .arrow-badge{display:flex;align-items:center;gap:2px;font-size:10px;padding:1px 5px;border-radius:8px;font-family:'DM Sans',sans-serif;font-weight:600;margin-top:1px}
    .arrow-badge.up{background:rgba(90,170,110,.15);color:var(--green)}
    .arrow-badge.dn{background:rgba(192,88,88,.15);color:var(--red)}
    .arrow-badge.eq{background:rgba(200,168,92,.1);color:var(--gold)}
    .cmp-obs{margin:14px 14px 0;border-radius:14px;overflow:hidden;border:1px solid var(--border)}
    .cmp-obs-hdr{background:var(--surface);padding:10px 14px;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border)}
    .cmp-obs-item{padding:13px 14px;border-bottom:1px solid var(--border);background:var(--card)}
    .cmp-obs-item:last-child{border-bottom:none}
    .cmp-obs-name{font-family:'Playfair Display',serif;font-size:13px;color:var(--text);margin-bottom:6px;display:flex;align-items:center;gap:6px}
    .cmp-obs-txt{font-size:12px;color:#AABCB4;font-style:italic;line-height:1.65;white-space:pre-wrap}

    .fab{position:fixed;bottom:24px;right:18px;width:58px;height:58px;border-radius:50%;background:linear-gradient(140deg,var(--accent),#9A5430);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 24px rgba(201,114,69,.5);z-index:10;border:none}
    .fab-ai{position:fixed;bottom:92px;right:18px;width:52px;height:52px;border-radius:50%;background:linear-gradient(140deg,#4A8C5C,#2A5C3A);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(74,140,92,.5);z-index:10;border:none}

    .fhdr{padding:52px 18px 18px;background:linear-gradient(to bottom,var(--surface),var(--bg));display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border)}
    .back{background:var(--surface);border:1px solid var(--border);color:var(--muted);width:38px;height:38px;border-radius:10px;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .ftitle{font-family:'Playfair Display',serif;font-size:21px}
    .fbody{padding:22px 18px}
    .field{margin-bottom:24px}
    .fl{display:block;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
    .fi{width:100%;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;font-size:16px;color:var(--text)}
    .fi:focus{border-color:var(--accent)}
    .stars-pick{display:flex;gap:2px}
    .sp{font-size:40px;line-height:1;background:none;border:none;color:var(--gold);opacity:.2;padding:6px 8px;border-radius:10px;transition:opacity .1s}
    .sp.on{opacity:1}
    .itbl{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
    .irow{display:grid;grid-template-columns:24px 1fr 68px 56px 28px;padding:9px 8px 9px 10px;align-items:center;gap:5px;border-bottom:1px solid var(--border)}
    .ihd{display:grid;grid-template-columns:24px 1fr 68px 56px 28px;padding:7px 8px 7px 10px;border-bottom:1px solid var(--border)}
    .imove{display:flex;flex-direction:column;gap:1px}
    .imv-btn{background:none;border:none;color:var(--dim);font-size:11px;line-height:1;padding:1px;cursor:pointer;height:11px;display:flex;align-items:center;justify-content:center}
    .imv-btn:hover{color:var(--accent)}
    .imv-btn:disabled{opacity:.25;cursor:not-allowed}
    .inom{background:none;border:none;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--text);width:100%}
    .iqty{background:none;border:none;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--gold);width:100%;text-align:right}
    .isel{background:var(--card);border:1px solid var(--border);border-radius:6px;font-size:11px;color:var(--muted);padding:4px 2px;width:100%;font-family:'DM Sans',sans-serif}
    .idel{background:none;border:none;color:var(--dim);font-size:20px;line-height:1;width:100%;display:flex;align-items:center;justify-content:center}
    .iadd{width:100%;padding:11px 14px;background:none;border:none;border-top:1px solid var(--border);color:var(--accent);font-size:12px;display:flex;align-items:center;gap:5px}
    .ota{width:100%;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;font-size:14px;line-height:1.75;resize:vertical;color:#AABCB4;font-style:italic;min-height:100px}
    .ota:focus{border-color:var(--accent)}
    .aibox{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
    .aibox textarea{width:100%;padding:12px 14px;background:none;border:none;font-size:14px;line-height:1.7;resize:none;color:var(--text);min-height:90px;display:block}
    .aibox textarea:focus{outline:none}
    .aibox-foot{display:flex;justify-content:flex-end;padding:8px 10px;border-top:1px solid var(--border)}
    .aibox-btn{padding:8px 16px;background:linear-gradient(140deg,#4A8C5C,#2A5C3A);border:none;border-radius:8px;color:#fff;font-size:12px;font-weight:500}
    .aibox-btn:disabled{opacity:.5}
    .savebtn{width:100%;padding:15px;background:linear-gradient(140deg,var(--accent),#9A5430);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:500;margin-top:4px}

    .voverlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:200;display:flex;align-items:flex-end}
    .vsheet{width:100%;background:var(--card);border-radius:24px 24px 0 0;padding:28px 22px 40px;border-top:1px solid var(--border);animation:sh .3s cubic-bezier(.32,.72,0,1);max-height:92vh;overflow-y:auto}
    .vtitle{font-family:'Playfair Display',serif;font-size:20px;text-align:center;margin-bottom:4px}
    .vsub{font-size:12px;color:var(--muted);text-align:center;margin-bottom:18px;line-height:1.6}
    .vtxa{width:100%;padding:13px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;font-size:14px;line-height:1.7;resize:none;color:var(--text);min-height:120px;margin-bottom:14px}
    .vtxa:focus{border-color:var(--accent);outline:none}
    .vai{display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px 0}
    .vai-spin{width:36px;height:36px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
    .vai-txt{font-size:13px;color:var(--muted);text-align:center}
    .vbtns{display:flex;gap:10px}
    .vcancel{flex:1;padding:13px;background:none;border:1px solid var(--border);border-radius:10px;color:var(--muted);font-size:13px}
    .vok{flex:2;padding:13px;background:linear-gradient(140deg,#4A8C5C,#2A5C3A);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:500}

    .exp-tabs{display:flex;gap:6px;margin-bottom:14px}
    .exp-tab{flex:1;padding:9px;border-radius:9px;border:1px solid var(--border);background:none;color:var(--muted);font-size:12px}
    .exp-tab.on{background:var(--surface);color:var(--gold);border-color:var(--gold)}
    .exp-ta{width:100%;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.55;color:#AABCB4;height:200px;resize:vertical;margin-bottom:12px;white-space:pre}
    .exp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
    .exp-btn{padding:12px 8px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px}
    .exp-btn.primary{background:linear-gradient(140deg,var(--accent),#9A5430);border:none;color:#fff}
    .exp-note{font-size:11px;color:var(--muted);line-height:1.6;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:12px}
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:34px;background:var(--surface);border:1px solid var(--gold);color:var(--gold);padding:11px 20px;border-radius:24px;font-size:13px;z-index:400;box-shadow:0 6px 24px rgba(0,0,0,.5)}

    .empty{text-align:center;padding:80px 24px}
    .eicon{font-size:42px;margin-bottom:16px;opacity:.3}
    .etitle{font-family:'Playfair Display',serif;font-size:18px;color:var(--dim);margin-bottom:8px}
    .esub{font-size:13px;color:var(--muted);line-height:1.7}
    .boot{display:flex;flex-direction:column;align-items:center;justify-content:center;height:80vh;gap:14px}
  </style>
</head>

/* ═══════════ STORE : MySQL cPanel + localStorage de secours ═══════════ */
var LS_KEY = 'deo_user_v7';
var _userData = {}, _deletedIds = [];
var syncState = 'local'; // 'cloud' | 'local' | 'error'

function readLocal() {
  try { var r = JSON.parse(localStorage.getItem(LS_KEY)||'{}'); return {edited:r.edited||{}, deleted:r.deleted||[]}; }
  catch(e) { return {edited:{}, deleted:[]}; }
}
function writeLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({edited:_userData, deleted:_deletedIds})); } catch(e) {}
}
function apiCall(action, payload) {
  var body = new URLSearchParams();
  Object.keys(payload||{}).forEach(function(key){ body.append(key, payload[key]); });
  return fetch('api.php?action='+encodeURIComponent(action), {
    method:'POST',
    credentials:'same-origin',
    headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
    body:body.toString()
  }).then(function(response){
    return response.json().catch(function(){ return {ok:false,error:'Réponse serveur invalide.'}; });
  });
}
function ensureAuth() {
  return apiCall('me').then(function(status){
    if(status.auth) return true;
    var password = window.prompt('Mot de passe du Mailer pour synchroniser le Labo Déo :');
    if(!password) throw new Error('Connexion annulée');
    return apiCall('login',{password:password}).then(function(result){
      if(!result.ok) throw new Error(result.error||'Connexion impossible');
      return true;
    });
  });
}
function writeCloud() {
  writeLocal();
  return apiCall('save',{data:JSON.stringify({edited:_userData,deleted:_deletedIds})})
    .then(function(result){
      if(!result.ok) throw new Error(result.error||'Sauvegarde impossible');
      syncState='cloud';
    })
    .catch(function(error){ syncState='error'; throw error; });
}
function initStore() {
  var local = readLocal();
  return ensureAuth()
    .then(function(){ return apiCall('load'); })
    .then(function(server){
      if(!server.ok) throw new Error(server.error||'Chargement impossible');
      var cloud = server.data;
      if(cloud) {
        _userData = Object.assign({}, local.edited, cloud.edited||{});
        var deleted = (cloud.deleted||[]).slice();
        (local.deleted||[]).forEach(function(id){ if(deleted.indexOf(id)<0) deleted.push(id); });
        _deletedIds = deleted;
      } else {
        _userData = local.edited;
        _deletedIds = local.deleted;
      }
      syncState='cloud';
      writeLocal();
      return writeCloud();
    })
    .catch(function(error){
      _userData=local.edited; _deletedIds=local.deleted; syncState='error';
      setTimeout(function(){ alert('Synchronisation serveur indisponible. Les modifications restent sauvegardées dans ce navigateur.\n\n'+error.message); },100);
    });
}

var store = {
  get: function() {
    var fromSeeds = ALL_SEEDS.filter(function(s){ return _deletedIds.indexOf(s.id)<0; })
      .map(function(s){ return _userData[s.id] ? Object.assign({},s,_userData[s.id]) : s; });
    var userCreated = Object.keys(_userData).map(function(k){ return _userData[k]; })
      .filter(function(p){ return p && p.id && !ALL_SEEDS.find(function(s){ return s.id===p.id; }); });
    return userCreated.concat(fromSeeds);
  },
  save: function(data) {
    var edited = {}, deleted = _deletedIds.slice();
    data.forEach(function(p){ edited[p.id] = p; });
    ALL_SEEDS.forEach(function(s){ if(!data.find(function(p){ return p.id===s.id; }) && deleted.indexOf(s.id)<0) deleted.push(s.id); });
    _userData = edited; _deletedIds = deleted;
    writeLocal(); writeCloud();
  },
  replaceAll: function(protos) {
    _deletedIds = [];
    store.save(protos);
  }
};

/* ═══════════ Helpers ═══════════ */
function getFamily(nom) { var m = nom.match(/^V?(\d+)/i); return m ? 'V'+m[1] : 'Autres'; }
function groupProtos(protos) {
  var map = {};
  protos.forEach(function(p) { var f=getFamily(p.nom); if(!map[f]) map[f]=[]; map[f].push(p); });
  Object.keys(map).forEach(function(k){ map[k].sort(function(a,b){ return a.nom.localeCompare(b.nom,undefined,{numeric:true}); }); });
  return Object.keys(map).sort(function(a,b){ return a.localeCompare(b,undefined,{numeric:true}); }).map(function(k){ return {name:k,protos:map[k]}; });
}
function fi(p) { return (p.ingredients||[]).filter(function(i){ return i.nom && i.nom.trim(); }); }
function tg(p) { return (p.ingredients||[]).filter(function(i){ return i.unite==='g'; }).reduce(function(s,i){ return s+(parseFloat(i.quantite)||0); },0); }
function fmt(v) { return v===0?'':v%1===0?String(v):v.toFixed(1); }
function starsHtml(n, cls, sz) { var out=''; for(var i=1;i<=5;i++) out+='<span class="'+cls+(i<=n?' on':'')+'" style="font-size:'+sz+'px">★</span>'; return out; }
function bestStars(protos) { return Math.max.apply(null,[0].concat(protos.map(function(p){ return p.etoiles||0; }))); }
function normName(s) { return s.toLowerCase().trim(); }
function esc(s) { return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toast(msg) {
  var old = document.getElementById('toast'); if(old) old.remove();
  var t = document.createElement('div'); t.id='toast'; t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.remove(); }, 2600);
}

/* ═══════════ EXPORT / IMPORT ═══════════ */
function exportJSON() {
  var protos = store.get().slice().sort(function(a,b){ return a.nom.localeCompare(b.nom,undefined,{numeric:true}); });
  return JSON.stringify({app:'Labo Déo', version:1, exportedAt:new Date().toISOString(), count:protos.length, protos:protos}, null, 2);
}
function exportTexte() {
  var protos = store.get().slice().sort(function(a,b){ return a.nom.localeCompare(b.nom,undefined,{numeric:true}); });
  var out = 'LABO DÉO — Export du '+new Date().toLocaleString('fr-FR')+'\n'+protos.length+' formulations\n';
  out += '='.repeat(50)+'\n\n';
  protos.forEach(function(p){
    out += p.nom+'  ['+(p.etoiles||0)+'/5]  '+(p.date||'')+'\n';
    out += '-'.repeat(40)+'\n';
    fi(p).forEach(function(i){ out += '  '+i.nom+' : '+i.quantite+i.unite+'\n'; });
    var t = tg(p); if(t>0) out += '  → Total : '+fmt(t)+'g\n';
    if(p.commentaires) out += '\n  '+p.commentaires.replace(/\n/g,'\n  ')+'\n';
    out += '\n';
  });
  return out;
}
function download(filename, content, mime) {
  try {
    var blob = new Blob([content], {type:mime||'text/plain;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 300);
    toast('Fichier téléchargé');
  } catch(e) { toast('Téléchargement impossible — copie le texte'); }
}
function copyText(txt) {
  var ta = document.getElementById('exp-ta');
  if(ta) { ta.focus(); ta.select(); ta.setSelectionRange(0, 999999); }
  if(navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function(){ toast('Copié dans le presse-papier'); })
      .catch(function(){ try{ document.execCommand('copy'); toast('Copié'); }catch(e){ toast('Sélectionne et copie manuellement'); } });
  } else {
    try { document.execCommand('copy'); toast('Copié'); } catch(e) { toast('Sélectionne et copie manuellement'); }
  }
}

    '<div class="vtitle">⇪ Sauvegarde</div>'+

      '<button class="exp-btn" id="exp-import">⇧ Importer</button>'+
      '<button class="exp-btn" id="exp-close">Fermer</button>'+
    '</div>'+
    '<div class="exp-note">Le <strong style="color:var(--gold)">JSON</strong> permet de tout restaurer plus tard via « Importer ». Le <strong style="color:var(--gold)">Texte</strong> est une version lisible pour archiver ou partager.</div>';

  document.getElementById('tab-json').onclick = function(){ expTab='json'; renderExport(); };
  document.getElementById('tab-txt').onclick = function(){ expTab='txt'; renderExport(); };
  document.getElementById('exp-copy').onclick = function(){ copyText(content); };
  document.getElementById('exp-dl').onclick = function(){
    if(expTab==='json') download('labo-deo-'+stamp+'.json', content, 'application/json');
    else download('labo-deo-'+stamp+'.txt', content, 'text/plain;charset=utf-8');
  };
  document.getElementById('exp-import').onclick = openImport;
  document.getElementById('exp-close').onclick = function(){ var o=document.getElementById('voverlay'); if(o) o.remove(); };
}

function openImport() {
  var old = document.getElementById('voverlay'); if(old) old.remove();
  var ov = document.createElement('div'); ov.id='voverlay'; ov.className='voverlay';
  ov.innerHTML = '<div class="vsheet">'+
    '<div class="vtitle">⇧ Importer</div>'+
    '<div class="vsub">Colle un export JSON pour restaurer ou fusionner tes formulations</div>'+
    '<textarea class="vtxa" id="imp-ta" placeholder=\'{"app":"Labo Déo", "protos":[…]}\'></textarea>'+
    '<div class="exp-grid">'+
      '<button class="exp-btn" id="imp-merge">Fusionner</button>'+
      '<button class="exp-btn primary" id="imp-replace">Remplacer tout</button>'+
    '</div>'+
    '<button class="vcancel" style="width:100%;margin-top:4px" id="imp-cancel">Annuler</button>'+
    '<div class="exp-note" style="margin-top:12px"><strong style="color:var(--gold)">Fusionner</strong> : ajoute ce qui manque, garde l\'existant.<br><strong style="color:var(--gold)">Remplacer tout</strong> : efface l\'état actuel et repart de l\'export.</div>'+
  '</div>';
  document.body.appendChild(ov);
  ov.onclick = function(e){ if(e.target===ov) ov.remove(); };
  document.getElementById('imp-cancel').onclick = function(){ ov.remove(); };

  function parseInput() {
    var raw = document.getElementById('imp-ta').value.trim();
    if(!raw) { toast('Colle d\'abord un export'); return null; }
    try {
      var d = JSON.parse(raw);
      var protos = Array.isArray(d) ? d : (d.protos || (d.edited ? Object.keys(d.edited).map(function(k){ return d.edited[k]; }) : null));
      if(!protos || !protos.length) { toast('Aucune formulation trouvée'); return null; }
      return protos.map(function(p){
        return {
          id: p.id || uid(),
          nom: p.nom || 'Sans nom',
          date: p.date || new Date().toLocaleDateString('fr-FR'),
          etoiles: Math.min(5, Math.max(0, parseInt(p.etoiles)||0)),
          commentaires: p.commentaires || '',
          ingredients: (p.ingredients||[]).map(function(i){ return {id:i.id||uid(), nom:i.nom||'', quantite:String(i.quantite==null?'':i.quantite), unite:i.unite||'g'}; })
        };
      });
    } catch(e) { toast('JSON invalide'); return null; }
  }

  document.getElementById('imp-merge').onclick = function(){
    var incoming = parseInput(); if(!incoming) return;
    var current = store.get(); var byId = {}; var added = 0;
    current.forEach(function(p){ byId[p.id]=p; });
    incoming.forEach(function(p){ if(!byId[p.id]) { current = [p].concat(current); added++; } });
    store.save(current);
    ov.remove(); render(); toast(added+' formulation(s) ajoutée(s)');
  };
  document.getElementById('imp-replace').onclick = function(){
    var incoming = parseInput(); if(!incoming) return;
    store.replaceAll(incoming);
    ov.remove(); render(); toast(incoming.length+' formulation(s) restaurée(s)');
  };
}

/* ═══════════ Claude API ═══════════ */
function callClaude(text, mode) {
  var sysNew = 'Assistant labo déodorant. JSON uniquement sans backticks: {"nom":"string","ingredients":[{"nom":"string","quantite":"string","unite":"g ou % ou mL ou mg ou gttes"}],"commentaires":"string","etoiles":0}';
  var sysObs = 'Assistant labo déodorant. JSON uniquement sans backticks: {"commentaires":"string","etoiles":0}';
  return fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,system:mode==='new'?sysNew:sysObs,messages:[{role:'user',content:text}]})})
    .then(function(r){ return r.json(); })
    .then(function(d){ if(d.error) throw new Error(d.error.message); var raw=(d.content||[]).filter(function(b){ return b.type==='text'; }).map(function(b){ return b.text; }).join('').replace(/```json\n?|```\n?/g,'').trim(); return JSON.parse(raw.match(/\{[\s\S]*\}/)[0]); });
}

function getAllIngredientNames() {
  var names = {};
  store.get().forEach(function(p){ fi(p).forEach(function(ing){ names[ing.nom.trim()] = true; }); });
  return Object.keys(names).sort();
}

function moveIngredient(id, dir) {
  captureForm();

  if(newIdx < 0 || newIdx >= S.editing.ingredients.length) return;
  var ings = S.editing.ingredients.slice();
  var tmp = ings[idx]; ings[idx] = ings[newIdx]; ings[newIdx] = tmp;
  S.editing.ingredients = ings; render();

/* ═══════════ Compare ═══════════ */
function buildCompareView() {
  var all = store.get();
  var protos = Object.keys(S.selected).map(function(id){ return all.find(function(p){ return p.id===id; }); }).filter(Boolean);
  protos.sort(function(a,b){ return a.nom.localeCompare(b.nom,undefined,{numeric:true}); });
  if(protos.length < 2) return '<div class="empty"><div class="eicon">⚖️</div><div class="etitle">Sélectionne au moins 2 versions</div></div>';
  var allNormNames = [], normToDisplay = {};
  protos.forEach(function(p){ fi(p).forEach(function(ing){ var n=normName(ing.nom); if(!normToDisplay[n]){ normToDisplay[n]=ing.nom; allNormNames.push(n); } }); });
  allNormNames.sort(function(a,b){
    var ca=protos.filter(function(p){ return fi(p).find(function(i){ return normName(i.nom)===a; }); }).length;
    var cb=protos.filter(function(p){ return fi(p).find(function(i){ return normName(i.nom)===b; }); }).length;
    return cb-ca;
  });
  var thead = '<div class="cmp-thead"><div class="cmp-th-ing">Ingrédient</div>'+protos.map(function(p){ return '<div class="cmp-th-v">'+esc(p.nom)+'</div>'; }).join('')+'</div>';
  var rows = allNormNames.map(function(nn){
    var vals = protos.map(function(p){ var ing=fi(p).find(function(i){ return normName(i.nom)===nn; }); return ing?(parseFloat(ing.quantite)||0):null; });
    var pv = vals.filter(function(v){ return v!==null; });
    var hasDiff = pv.length>1 && !pv.every(function(v){ return v===pv[0]; });
    var maxV=Math.max.apply(null,pv), minV=Math.min.apply(null,pv);
    var cells = vals.map(function(v, idx){
      if(v===null) return '<div class="cmp-cell absent">—</div>';
      var cls='cmp-cell', badge='';
      if(hasDiff){ if(v===maxV) cls+=' hi'; else if(v===minV) cls+=' lo'; else cls+=' same'; } else cls+=' same';
      if(idx>0){ var prev=vals[idx-1];
        if(prev!==null){ var d=v-prev; badge = d>0?'<div class="arrow-badge up">↑ +'+d+'g</div>':(d<0?'<div class="arrow-badge dn">↓ '+d+'g</div>':'<div class="arrow-badge eq">→ =</div>'); }
        else badge='<div class="arrow-badge up">↑ nouveau</div>';
      }
      return '<div class="'+cls+'"><span>'+v+'g</span>'+badge+'</div>';
    }).join('');
    return '<div class="cmp-row'+(hasDiff?' has-diff':'')+'"><div class="cmp-ing">'+esc(normToDisplay[nn])+'</div>'+cells+'</div>';
  }).join('');
  var totCells = protos.map(function(p,idx){
    var t=tg(p), badge='';
    if(idx>0){ var d=t-tg(protos[idx-1]); badge = d>0?'<div class="arrow-badge up">↑ +'+fmt(d)+'g</div>':(d<0?'<div class="arrow-badge dn">↓ '+fmt(d)+'g</div>':'<div class="arrow-badge eq">→ =</div>'); }
    return '<div class="cmp-cell same"><span>'+(t>0?fmt(t)+'g':'—')+'</span>'+badge+'</div>';
  }).join('');
  var totRow = '<div class="cmp-row total-row"><div class="cmp-ing" style="color:var(--muted);font-size:11px">Total (g)</div>'+totCells+'</div>';
  var starsRows = protos.map(function(p){ return '<div style="padding:10px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)"><span style="font-size:12px;color:var(--muted)">'+esc(p.nom)+'</span><div>'+starsHtml(p.etoiles||0,'ps',13)+'</div></div>'; }).join('');
  var obsItems = protos.map(function(p){ return '<div class="cmp-obs-item"><div class="cmp-obs-name">'+starsHtml(p.etoiles||0,'ps',11)+' '+esc(p.nom)+'</div><div class="cmp-obs-txt">'+(p.commentaires?esc(p.commentaires):'<span style="color:var(--dim)">Aucune observation</span>')+'</div></div>'; }).join('');
  return '<div class="cmp-view">'+
    '<div class="cmp-hdr"><button class="back" id="back">←</button><div><div class="cmp-title">Comparaison</div><div class="cmp-subtitle">'+protos.map(function(p){ return esc(p.nom); }).join(' → ')+'</div></div></div>'+
    '<div class="cmp-legend"><div class="leg"><span style="color:var(--green);font-weight:700">↑</span> augmentation</div><div class="leg"><span style="color:var(--red);font-weight:700">↓</span> diminution</div><div class="leg"><span style="color:var(--gold)">→</span> identique</div></div>'+
    '<div class="cmp-table"><div class="cmp-inner">'+thead+rows+totRow+'</div></div>'+
    '<div style="margin:14px 14px 0;border-radius:14px;overflow:hidden;border:1px solid var(--border)"><div style="background:var(--surface);padding:10px 14px;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border)">Notes</div>'+starsRows+'</div>'+
    '<div class="cmp-obs"><div class="cmp-obs-hdr">Observations</div>'+obsItems+'</div>'+
  '</div>';
}

/* ═══════════ Bind ═══════════ */
function bind() {
  var backBtn = document.getElementById('back');
  if(backBtn) backBtn.onclick = function(){ S.view='list'; S.editing=null; render(); };
  if(S.view==='compare') return;

  if(S.view==='form') {
    document.querySelectorAll('.sp').forEach(function(btn){
      btn.onclick = function(){
        var n=parseInt(btn.dataset.s);
        S.editing.etoiles = S.editing.etoiles===n?0:n;
        document.querySelectorAll('.sp').forEach(function(b,i){ b.classList.toggle('on',i<S.editing.etoiles); });
      };
    });
    document.querySelectorAll('[data-did]').forEach(function(btn){ btn.onclick=function(){ captureForm(); if(S.editing.ingredients.length>1) S.editing.ingredients=S.editing.ingredients.filter(function(i){ return i.id!==btn.dataset.did; }); render(); }; });
    document.querySelectorAll('[data-mv-up]').forEach(function(btn){ btn.onclick=function(){ moveIngredient(btn.dataset.mvUp, -1); }; });
    document.querySelectorAll('[data-mv-dn]').forEach(function(btn){ btn.onclick=function(){ moveIngredient(btn.dataset.mvDn, 1); }; });
    var iadd=document.getElementById('iadd'); if(iadd) iadd.onclick=function(){ captureForm(); S.editing.ingredients=S.editing.ingredients.concat([blankI()]); render(); };
    var aibtn=document.getElementById('ai-btn');
    if(aibtn) aibtn.onclick=function(){
      var text=document.getElementById('ai-tx').value.trim(); if(!text){toast('Écris quelque chose');return;}
      captureForm(); var cur=(S.editing.commentaires||'').trim(); S.editing.commentaires=cur?cur+'\n'+text:text;
      aibtn.disabled=true; aibtn.textContent='…';
      callClaude(S.editing.commentaires,'obs').then(function(res){
        if(res.commentaires) S.editing.commentaires=res.commentaires;
        if(res.etoiles!==undefined) S.editing.etoiles=Math.min(5,Math.max(0,parseInt(res.etoiles)||0));
        render();
      }).catch(function(err){ toast('Erreur : '+err.message); aibtn.disabled=false; aibtn.textContent='✦ Analyser'; });
    };
    var save=document.getElementById('savebtn'); if(save) save.onclick=saveProto;
    return;
  }

  var ex=document.getElementById('btn-export'); if(ex) ex.onclick=openExport;
  var fabBtn=document.getElementById('fab'); if(fabBtn) fabBtn.onclick=function(){ S.editing=blankP(store.get().length+1); S.view='form'; render(); };
  var fabAi=document.getElementById('fab-ai'); if(fabAi) fabAi.onclick=openAI;
  var ss=document.getElementById('sort-stars'); if(ss) ss.onclick=function(){ S.sortByStars=true; render(); };
  var sd=document.getElementById('sort-date'); if(sd) sd.onclick=function(){ S.sortByStars=false; render(); };
  var tc=document.getElementById('toggle-cmp'); if(tc) tc.onclick=function(){ S.compareMode=!S.compareMode; if(!S.compareMode) S.selected={}; render(); };
  var cr=document.getElementById('cmp-reset'); if(cr) cr.onclick=function(){ S.compareMode=false; S.selected={}; render(); };
  var cg=document.getElementById('cmp-go'); if(cg) cg.onclick=function(){ if(Object.keys(S.selected).length>=2){ S.view='compare'; render(); } };

  document.querySelectorAll('[data-cmp]').forEach(function(el){ el.onclick=function(e){ e.stopPropagation(); var id=el.dataset.cmp; if(S.selected[id]) delete S.selected[id]; else S.selected[id]=true; render(); }; });
  document.querySelectorAll('[data-grp]').forEach(function(el){ el.onclick=function(){ var g=el.dataset.grp; S.openGroups[g]=!S.openGroups[g]; render(); }; });
  document.querySelectorAll('[data-proto]').forEach(function(el){
    el.onclick=function(e){ e.stopPropagation();
      if(S.compareMode){ var id=el.dataset.proto; if(S.selected[id]) delete S.selected[id]; else S.selected[id]=true; render(); return; }
      S.openProto=S.openProto===el.dataset.proto?null:el.dataset.proto; render();
    };
  });
  document.querySelectorAll('[data-edit]').forEach(function(el){
    el.onclick=function(e){ e.stopPropagation(); var p=store.get().find(function(x){ return x.id===el.dataset.edit; }); S.editing=Object.assign({},p,{ingredients:p.ingredients.map(function(i){ return Object.assign({},i); })}); S.view='form'; render(); };
  });
  document.querySelectorAll('[data-dup]').forEach(function(el){ el.onclick=function(e){ e.stopPropagation(); duplicateProto(el.dataset.dup); }; });
  document.querySelectorAll('[data-del]').forEach(function(el){ el.onclick=function(e){ e.stopPropagation(); delProto(el.dataset.del); }; });
}

/* ═══════════ Boot ═══════════ */
initStore().then(function(){ render(); }).catch(function(){ render(); });
</script>
</body>
</html>
